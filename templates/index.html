
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduGenie — AI Learning Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">AI-POWERED LEARNING</p>
        <h1>EduGenie</h1>
        <p>Ask, understand, revise, practice, and build your learning path.</p>
      </div>
      <span id="status" class="status">Checking API…</span>
    </header>

    <section class="card">
      <label for="task">Choose a learning task</label>
      <select id="task">
        <option value="qa">Question & Answer</option>
        <option value="explain">Explain a Concept</option>
        <option value="quiz">Generate Quiz</option>
        <option value="summarize">Summarize</option>
        <option value="learn">Learning Path</option>
      </select>

      <div id="levelRow" class="hidden">
        <label for="level">Learner level</label>
        <select id="level">
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
        <label for="weeks">Weeks</label>
        <input id="weeks" type="number" min="1" max="52" value="6">
      </div>

      <label for="inputText">Your input</label>
      <textarea id="inputText" rows="9"
        placeholder="Ask a question, enter a topic, or paste a passage…"></textarea>

      <div class="actions">
        <button id="runBtn">Generate</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>
    </section>

    <section id="resultCard" class="card result-card hidden">
      <div class="result-heading">
        <h2>Result</h2>
        <button id="copyBtn" class="secondary small">Copy</button>
      </div>
      <div id="result"></div>
    </section>

    <footer>EduGenie • FastAPI • Google Gemini</footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
